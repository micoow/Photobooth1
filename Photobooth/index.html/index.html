<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Photobooth</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #eef1f5;
      color: #333;
    }

    h1 {
      font-size: 32px;
      color: #444;
      margin-bottom: 10px;
    }

    video, canvas {
      width: 360px;
      height: 270px;
      border-radius: 14px;
      margin: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      background: black;
    }

    #controls {
      margin-top: 15px;
    }

    button, select {
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #4c8bf5;
      color: white;
      transition: 0.2s;
    }

    button:hover, select:hover {
      background: #2f6de0;
    }

    select {
      background: #eee;
      color: #333;
      border: 1px solid #bbb;
    }

    #gallery img {
      width: 150px;
      margin: 8px;
      border-radius: 8px;
      border: 2px solid #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    #timer {
      font-size: 40px;
      font-weight: bold;
      color: #d9534f;
      height: 50px;
    }

    #status {
      font-size: 18px;
      color: #555;
      height: 30px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>📸 Advanced Photobooth</h1>
  <h2 id="timer"></h2>
  <video id="video" autoplay></video>
  <canvas id="canvas"></canvas>

  <div id="controls">
    <button id="startBtn">Start Camera</button>
    <button id="captureBtn">Capture</button>

    <select id="filterSelect">
      <option value="none">No Filter</option>
      <option value="grayscale(100%)">Black & White</option>
      <option value="sepia(100%)">Sepia</option>
      <option value="contrast(180%)">High Contrast</option>
      <option value="blur(3px)">Blur</option>
    </select>

    <select id="layoutSelect">
      <option value="single">Single Photo</option>
      <option value="two">2 Vertical Photos</option>
      <option value="four">4 Photo Grid</option>
    </select>
  </div>

  <h3 id="status"></h3>

  <h2>📁 Gallery</h2>
  <div id="gallery"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const timerText = document.getElementById('timer');
    const statusText = document.getElementById('status');
    const gallery = document.getElementById('gallery');

    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const filterSelect = document.getElementById('filterSelect');
    const layoutSelect = document.getElementById('layoutSelect');

    let cameraOn = false;

    // Start camera
    startBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        cameraOn = true;
        statusText.textContent = "Camera started ✔️";
      } catch (err) {
        statusText.textContent = "❌ Camera access denied or not found.";
      }
    };

    // Timer countdown
    function startTimer(seconds) {
      return new Promise(resolve => {
        let count = seconds;
        const interval = setInterval(() => {
          timerText.textContent = count;
          count--;
          if (count < 0) {
            clearInterval(interval);
            timerText.textContent = "";
            resolve();
          }
        }, 1000);
      });
    }

    // Capture a single image from video
    function captureImage(filter) {
      ctx.filter = filter;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/png");
    }

    // Four different photos
    async function captureFourPhotos() {
      const filter = filterSelect.value;
      const photos = [];

      statusText.textContent = "Taking 4 photos...";

      for (let i = 1; i <= 4; i++) {
        statusText.textContent = `Capturing photo ${i} of 4...`;
        await startTimer(2);
        photos.push(captureImage(filter));
      }

      statusText.textContent = "Assembling grid...";

      // Build grid
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const halfW = canvas.width / 2;
      const halfH = canvas.height / 2;

      const imgs = await Promise.all(
        photos.map(src => new Promise(res => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = src;
        }))
      );

      ctx.drawImage(imgs[0], 0, 0, halfW, halfH);
      ctx.drawImage(imgs[1], halfW, 0, halfW, halfH);
      ctx.drawImage(imgs[2], 0, halfH, halfW, halfH);
      ctx.drawImage(imgs[3], halfW, halfH, halfW, halfH);

      statusText.textContent = "Done ✔️";

      return canvas.toDataURL("image/png");
    }

    captureBtn.onclick = async () => {
      if (!cameraOn) {
        statusText.textContent = "❌ Please start the camera first.";
        return;
      }

      const layout = layoutSelect.value;
      const filter = filterSelect.value;

      if (layout === "single") {
        await startTimer(3);
        const imgURL = captureImage(filter);
        addToGallery(imgURL);

      } else if (layout === "two") {
        await startTimer(3);

        ctx.filter = filter;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // two shots
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height / 2);
        await startTimer(1);
        ctx.drawImage(video, 0, canvas.height / 2, canvas.width, canvas.height / 2);

        addToGallery(canvas.toDataURL("image/png"));

      } else if (layout === "four") {
        const imgURL = await captureFourPhotos();
        addToGallery(imgURL);
      }
    };

    // Add a captured image to gallery
    function addToGallery(src) {
      const img = document.createElement('img');
      img.src = src;
      gallery.appendChild(img);
      statusText.textContent = "Photo saved to gallery ✔️";
    }
  </script>

</body>
</html>
